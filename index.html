<style>
  :root {

  html, body { height:100%; }
  body { background:var(--papir); color:var(--blekk); font-family:"Avenir Next","Segoe UI",system-ui,sans-serif; font-size:15px; display:flex; flex-direction:column; }
  h1,h2,h3 { font-family:Iowan Old Style, Georgia, serif; font-weight:600; letter-spacing:.03em; }
  header { padding:10px 18px; border-bottom:2px solid var(--blekk); display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:19px; }
  .merke { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--blekk-svak); }
  .kode { font-family:ui-monospace, Menlo, monospace; font-size:20px; letter-spacing:.2em; background:var(--blekk); color:var(--papir); padding:2px 10px; }
  .fase { padding:3px 10px; border:1px solid var(--blekk); font-size:13px; }
  .timer { font-family:ui-monospace, Menlo, monospace; font-size:22px; font-variant-numeric:tabular-nums; margin-left:auto; }
  .timer.ute { color:var(--feil); }
  main { flex:1; display:flex; min-height:0; }
  #kartflate { flex:1; min-width:0; position:relative; background:var(--vann-flate); }
  #kartflate svg { width:100%; height:100%; display:block; }
  aside { width:380px; border-left:1px solid var(--linje); background:var(--papir-dyp); padding:14px 16px; overflow-y:auto; font-size:13.5px; line-height:1.45; }
  aside h2 { font-size:14px; letter-spacing:.07em; text-transform:uppercase; margin:16px 0 6px; border-bottom:1px solid var(--linje); padding-bottom:3px; }
  aside h2:first-child { margin-top:0; }
  .kort { background:var(--papir); border:1px solid var(--linje); padding:10px 12px; margin-bottom:8px; }
  .kort.valgt { border-color:var(--blekk); box-shadow:0 0 0 2px var(--blekk) inset; }
  .kort.gb { border-left:5px solid var(--gb); } .kort.fr { border-left:5px solid var(--fr); } .kort.de { border-left:5px solid var(--de); }
  button { font:inherit; background:var(--blekk); color:var(--papir); border:none; padding:8px 14px; cursor:pointer; letter-spacing:.02em; }
  button.sek { background:transparent; color:var(--blekk); border:1px solid var(--blekk); }
  button.liten { padding:4px 9px; font-size:12.5px; }
  button.bred { width:100%; margin-top:8px; }
  button:disabled { opacity:.45; cursor:default; }
  button:focus-visible { outline:3px solid var(--vann); outline-offset:2px; }
  input, select { font:inherit; padding:6px 8px; border:1px solid var(--blekk-svak); background:var(--papir); color:var(--blekk); width:100%; }
  label { display:block; font-size:12.5px; color:var(--blekk-svak); margin-top:8px; }
  .rad { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .rad > * { flex:1; }
  .status { position:absolute; left:12px; bottom:10px; background:rgba(239,231,214,.94); border:1px solid var(--linje); padding:6px 12px; font-size:13px; max-width:60%; }
  .varsel { background:#F3E7C9; border-left:4px solid var(--varsel); padding:8px 10px; margin:8px 0; font-size:13px; }
  .info { background:#E3E9E3; border-left:4px solid var(--ok); padding:8px 10px; margin:8px 0; font-size:13px; }
  .feilboks { background:#F0D9D4; border-left:4px solid var(--feil); padding:8px 10px; margin:8px 0; font-size:13px; }
  .liste-stram { list-style:none; padding:0; } .liste-stram li { padding:4px 0; border-bottom:1px dotted var(--linje); }
  .poengtabell { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  .poengtabell td, .poengtabell th { padding:4px 6px; text-align:right; border-bottom:1px solid var(--linje); }

  .startkort h1 { font-size:28px; margin-bottom:4px; }

  }

</head>

<!-- ============ START ============ -->
<section id="start">
  <div class="startkort">
    <h1>Kampen om Afrika</h1>
    <div class="undertittel">En simulering av kappløpet om kolonier, 1884–1914 · etter B. Barker og R. Boden</div>
    <div class="fane">
      <button data-fane="elev" class="aktiv">Elev</button>
      <button data-fane="laerer">Lærer</button>
      <button data-fane="skjerm">Storskjerm</button>
    </div>
    <div id="lagring-varsel" class="varsel skjult"></div>

    <div id="fane-elev">
      <label>Spillkode (fra læreren)</label>
      <input id="elev-kode" maxlength="4" placeholder="f.eks. KWMT" autocapitalize="characters">
      <label>Ditt navn (eller stabens navn)</label>
      <input id="elev-navn" placeholder="Navn">
      <button class="bred" id="elev-videre">Finn spillet</button>
      <div id="elev-roller" class="skjult">
        <label>Velg rolle — flere elever kan dele én rolle som «stab»</label>
        <div id="rolleliste"></div>
      </div>
    </div>

    <div id="fane-laerer" class="skjult">
      <div class="rad">
        <div><label>Nytt spill: lærer-PIN</label><input id="ny-pin" type="password" placeholder="4+ tegn"></div>
        <div><label>&nbsp;</label><button class="bred" id="nytt-spill" style="margin-top:0">Opprett spill</button></div>
      </div>
      <p class="merke" style="margin:14px 0 4px">eller fortsett et spill</p>
      <div class="rad">
        <div><label>Spillkode</label><input id="laerer-kode" maxlength="4" autocapitalize="characters"></div>
        <div><label>PIN</label><input id="laerer-pin" type="password"></div>
      </div>
      <button class="bred sek" id="laerer-inn">Logg inn som lærer</button>
    </div>

    <div id="fane-skjerm" class="skjult">
      <label>Spillkode</label>
      <input id="skjerm-kode" maxlength="4" autocapitalize="characters">
      <button class="bred" id="skjerm-inn">Vis storskjerm</button>
      <p style="margin-top:10px;font-size:13px;color:var(--blekk-svak)">Storskjermen viser felleskartet, timeren og offentliggjøringen av ordrene — beregnet på prosjektor.</p>
    </div>
    <div id="start-feil" class="feilboks skjult"></div>
  </div>
</section>

<!-- ============ SPILL ============ -->
<header id="topp" class="skjult">
  <h1>Kampen om Afrika</h1>
  <span class="kode" id="topp-kode"></span>
  <span class="merke" id="topp-rolle"></span>
  <span class="fase" id="topp-fase"></span>
  <span class="timer" id="topp-timer"></span>
</header>
<main id="spill" class="skjult">
  <div id="kartflate">
    <svg id="kart" viewBox="0 0 1000 1100" role="img" aria-label="Spillkart"></svg>
    <div class="status" id="kart-status"></div>
  </div>
  <aside id="panel"></aside>
</main>
<section id="skjerm" class="skjult">
  <div id="kartflate-skjerm" style="flex:1;position:relative;background:var(--vann-flate)">
    <svg id="kart-skjerm" viewBox="0 0 1000 1100" role="img" aria-label="Felleskart"></svg>
  </div>
  <div class="avsl-tekst" id="skjerm-tekst"></div>
</section>

  return e.type === 'militaer' ? `${LAND[e.land].navn}s ${id.endsWith('_1')?'1.':'2.'} enhet fra ${base}` : `${LAND[e.land].navn}s sivile stasjon fra ${base}`;
}
function ordreTekst(o) {
  if (!o || o.type === 'ingen') return 'ingen ordre';
  if (o.type === 'staa') return 'blir stående';
  if (o.type === 'flytt') return `flytter til ${stedNavn(o.til)}`;
  if (o.type === 'stoett') return `blir stående og støtter flytting til ${stedNavn(o.til)}`;
  return '?';
}

function glatt(pts) {
  const n = pts.length; let d = `M ${pts[0].x} ${pts[0].y} `;
  for (let i=0;i<n;i++) { const p0=pts[(i-1+n)%n], p1=pts[i], p2=pts[(i+1)%n], p3=pts[(i+2)%n];
    d += `C ${p1.x+(p2.x-p0.x)/6} ${p1.y+(p2.y-p0.y)/6} ${p2.x-(p3.x-p1.x)/6} ${p2.y-(p3.y-p1.y)/6} ${p2.x} ${p2.y} `; }
  return d + 'Z';
}

async function startSpill(modus, kode, meta, rolleId) {
  app.modus = modus; app.kode = kode; app.meta = meta; app.rolle = rolleId ? ROLLE[rolleId] : null;
  vis('#start', false);

  await oppfrisk(true);
  if (app.teller) clearInterval(app.teller);
  app.teller = setInterval(() => oppfrisk(false), modus === 'skjerm' ? 3000 : 5000);
  setInterval(tegnTimer, 1000);
  document.addEventListener('focusout', () => { if (app.utsattRender) { app.utsattRender = false; setTimeout(() => { if (!document.activeElement?.closest?.('#panel select, #panel input')) render(); }, 150); } });
}

/* ---------- Synkronisering ---------- */
let oppfriskerNaa = false, oppfriskIgjen = null;
async function oppfrisk(tvang) {
  // Pågår en oppdatering allerede, kjøres en ny rett etterpå (i stedet for å hoppe over)
  if (oppfriskerNaa) { oppfriskIgjen = (oppfriskIgjen || false) || !!tvang; return; }
  oppfriskerNaa = true;
  try { await oppfriskEn(tvang); }
  finally {
    oppfriskerNaa = false;
    if (oppfriskIgjen !== null) { const t = oppfriskIgjen; oppfriskIgjen = null; await oppfrisk(t); }
  }
}
async function oppfriskEn(tvang) {
  {
    const meta = await hent(K.meta(app.kode)); if (!meta) return;
    const faseSkifte = tvang || !app.meta || meta.fase !== app.meta.fase || meta.runde !== app.meta.runde;
    const endret = faseSkifte || JSON.stringify(meta.poengTotal) !== JSON.stringify(app.meta.poengTotal);
    app.meta = meta;
    if (endret) {
      app.tilstand = await hent(K.tilstand(app.kode));
      app.resultat = meta.fase === 'avsloering' || meta.fase === 'ferdig' ? await hent(K.resultat(app.kode, meta.runde)) : null;
      if (meta.fase !== 'ordre') { app.valgtEnhet = null; }
      if (['ordre','forhandling'].includes(meta.fase) && app.modus === 'elev') {
        const lagret = await hent(K.ordre(app.kode, meta.runde, app.rolle.id));
        app.ordreListe = lagret?.ordrer || [];
        app.sistOrdreLagret = lagret?.av || null;
        if (app.rolle.type === 'diplomat') { app.forslag = (await hent(K.forslag(app.kode, meta.runde, app.rolle.land))) || []; }
      }
    }
    let noeNytt = endret;
    if (!endret && (meta.fase === 'avsloering' || meta.fase === 'ferdig') && !app.resultat) {
      app.resultat = await hent(K.resultat(app.kode, meta.runde));
      if (app.resultat) noeNytt = true;
    }
    if (meta.fase === 'avsloering') { const a = await hent(K.avsloering(app.kode)); if (JSON.stringify(a) !== JSON.stringify(app.avsl)) { app.avsl = a; noeNytt = true; } }
    if (!endret && ['ordre','forhandling'].includes(meta.fase) && app.modus === 'elev') {
      const lagret = await hent(K.ordre(app.kode, meta.runde, app.rolle.id));
      if (lagret && lagret.av !== app.navn && lagret.tid > (app.sistLokalTid || 0)) { app.ordreListe = lagret.ordrer || []; app.sistOrdreLagret = lagret.av; app.sistLokalTid = lagret.tid; noeNytt = true; }
      if (app.rolle.type === 'diplomat') { const f = (await hent(K.forslag(app.kode, meta.runde, app.rolle.land))) || []; if (JSON.stringify(f) !== JSON.stringify(app.forslag)) { app.forslag = f; noeNytt = true; } }

        const avtaler = (await hent(K.avtaler(app.kode, meta.runde))) || tomAvtaler();
        if (JSON.stringify([ordrer, alleForslag, avtaler]) !== JSON.stringify([app.ordrer, app.alleForslag, app.avtaler])) noeNytt = true;
        app.ordrer = ordrer; app.alleForslag = alleForslag; app.avtaler = avtaler;
      }
      if (meta.fase === 'lobby' || tvang) {

function tegnTimer() {

function ordreFor(enhetId) { return app.ordreListe.find(o => o.enhetId === enhetId) || { enhetId, type:'ingen' }; }

const ALLE_TILLATELSER = { suezSamtykke:['frankrike','tyskland'], baseInnpass:SPILLDATA.byer.filter(b=>b.base).flatMap(b=>SPILLDATA.land.map(l=>({by:b.id,land:l.id}))) };
function gyldigeMaal(enhetId, type) {

    return;
  }
  if (m.fase === 'ferdig') {
    panel.append(el('h2', {}, 'Sluttresultat')); panel.append(poengTabell(m.poengTotal, null));
    panel.append(el('div', { class:'info' }, 'Vinneren er landet med flest poeng totalt (s. 4). Bruk kartet og loggen til debrief: hvem samarbeidet, hvem ble spilt ut mot hverandre, og hva skjedde med byene?'));
    panel.append(justerPoeng());
    return;
  }

  if (REGJERINGSRUNDER.includes(m.runde)) panel.append(el('div', { class:'varsel' }, `Runde ${m.runde}: regjeringskontroll — diplomatenes ordre til militære enheter går foran offiserenes (s. 9, 14–15).`));

  if (m.fase === 'forhandling') {
    panel.append(el('div', { class:'info' }, 'Forhandlingsfase. Alle kan snakke med alle. Når tiden er ute: full stillhet, og du går til ordrefasen. Elevene kan ikke skrive troppeordre før da, men diplomatene kan sende inn avtaler underveis.'));
    const antForslag = SPILLDATA.land.reduce((s,l) => s + (app.alleForslag?.[l.id]?.length || 0), 0);
    if (antForslag) panel.append(el('div', { class:'varsel' }, `${antForslag} avtaleforslag er kommet inn – du godkjenner dem i ordrefasen.`));
    panel.append(el('button', { class:'bred', onclick: () => settFase('ordre') }, 'Tiden er ute → skriving av ordre'));
    panel.append(el('button', { class:'bred sek', onclick: () => settFase('forhandling') }, 'Start timeren på nytt'));
  }

  if (m.fase === 'ordre') {
    // Innkomne ordre
    panel.append(el('h2', {}, 'Innkomne ordre'));
    SPILLDATA.land.forEach(l => {
      panel.append(el('h3', { style:`color:${l.farge};margin-top:8px;font-size:14px` }, l.navn));
      ROLLER.filter(r => r.land===l.id && (r.type!=='diplomat' || REGJERINGSRUNDER.includes(m.runde))).forEach(r => {
        const d = app.ordrer[r.id];
        panel.append(el('div', { style:'font-size:13px;padding:3px 0;border-bottom:1px dotted var(--linje)' }, el('strong', {}, r.navn), d ? el('span', { style:'color:var(--ok)' }, ` ✔ ${d.av}`) : el('span', { style:'color:var(--feil)' }, ' – venter'),
          d ? el('div', { style:'font-size:12px;color:var(--blekk-svak)' }, d.ordrer.length ? d.ordrer.map(o => `${enhetNavn(o.enhetId).replace(/^.*?s /,'')}: ${ordreTekst(o)}`).join(' · ') : 'ingen ordre') : null));
      });
    });

    // Avtaler
    panel.append(el('h2', {}, 'Avtaler denne runden'));
    panel.append(el('div', { style:'font-size:12.5px;color:var(--blekk-svak)' }, 'Godkjenn forslag fra diplomatene når begge parter har sendt inn det samme. Godkjente avtaler gjelder når runden avgjøres.'));
    const a = app.avtaler;
    const godkjente = [];
    a.vennskapsavtaler.forEach((x,i) => godkjente.push([`Vennskapsavtale ${x.land.map(id=>LAND[id].navn).join(' – ')}`, () => a.vennskapsavtaler.splice(i,1)]));
    a.interessesfaerer.forEach((x,i) => godkjente.push([`Interessesfære ${x.byer.map(stedNavn).join(' + ')} → ${LAND[x.land].navn}`, () => a.interessesfaerer.splice(i,1)]));
    a.kolonier.forEach((x,i) => godkjente.push([`Koloni ${x.byer.map(stedNavn).join(' + ')} → ${LAND[x.land].navn}`, () => a.kolonier.splice(i,1)]));
    a.suezSamtykke.forEach((x,i) => godkjente.push([`Suez-samtykke: ${LAND[x].navn}`, () => a.suezSamtykke.splice(i,1)]));
    a.baseInnpass.forEach((x,i) => godkjente.push([`Innpass i ${stedNavn(x.by)}: ${LAND[x.land].navn}`, () => a.baseInnpass.splice(i,1)]));
    a.fellesOkkupasjon.forEach((x,i) => godkjente.push([`Felles okkupasjon ${stedNavn(x.by)}: ${x.land.map(id=>LAND[id].navn).join(' + ')}`, () => a.fellesOkkupasjon.splice(i,1)]));
    a.sivilInnpass.forEach((x,i) => godkjente.push([`Sivilt innpass ${stedNavn(x.by)}: ${LAND[x.land].navn}`, () => a.sivilInnpass.splice(i,1)]));
    if (godkjente.length) panel.append(el('div', { class:'kort' }, el('strong', {}, 'Godkjent:'), ...godkjente.map(([tekst, fjern]) => el('div', { class:'rad', style:'margin-top:4px' }, el('span', { style:'flex:3' }, tekst), el('button', { class:'liten sek', style:'flex:0', onclick: async () => { fjern(); await lagre(K.avtaler(app.kode, m.runde), a); renderLaerer(); } }, 'Fjern')))));
    SPILLDATA.land.forEach(l => (app.alleForslag?.[l.id]||[]).forEach(f => panel.append(el('div', { class:`kort ${KORT[l.id]}` },
      el('div', { class:'merke' }, `Forslag fra ${l.navn}`), el('div', {}, forslagTekst(f)),
      el('button', { class:'liten', style:'margin-top:6px', onclick: async () => { godkjenn(f); await lagre(K.avtaler(app.kode, m.runde), a); renderLaerer(); } }, 'Godkjenn')))));

    const antall = Object.keys(app.ordrer).length, forventet = ROLLER.filter(r => r.type!=='diplomat').length;
    panel.append(el('div', { class: antall < forventet ? 'varsel' : 'info' }, `${antall} av ${forventet} ordreark er levert. Ordre som ikke er levert regnes som «ingen ordre» (s. 5).`));
    panel.append(el('button', { class:'bred', onclick: avgjoerRunden }, 'Tiden er ute → avgjør runden'));
    panel.append(el('button', { class:'bred sek', onclick: () => settFase('ordre') }, 'Start timeren på nytt'));
  }

  if (m.fase === 'avsloering') {
    const steg = byggSteg(app.resultat), i = app.avsl?.steg ?? 0;
    panel.append(el('div', { class:'info' }, 'Offentliggjøring på storskjermen. Les gjerne ordrene høyt slik originalen legger opp til — elevene skal være helt stille.'));
    panel.append(el('div', { class:'kort' }, el('div', { class:'merke' }, `Steg ${i+1} av ${steg.length}${steg[i]?.overskrift ? ' · ' + steg[i].overskrift : ''}`), el('div', { style:'margin-top:4px' }, steg[i]?.tekst || '')));
    panel.append(el('div', { class:'rad' },
      el('button', { class:'sek', disabled: i<=0 ? '' : null, onclick: () => settSteg(i-1) }, '← Forrige'),
      el('button', { disabled: i>=steg.length-1 ? '' : null, onclick: () => settSteg(i+1) }, 'Neste →')));
    panel.append(el('button', { class:'bred sek', onclick: () => settSteg(steg.length-1) }, 'Hopp til poengene'));
    panel.append(el('h2', {}, 'Poeng denne runden'));
    panel.append(poengTabell(m.poengTotal, app.resultat?.poeng));
    panel.append(justerPoeng());
    if (m.runde >= m.maksRunder) panel.append(el('button', { class:'bred', onclick: avsluttSpill }, 'Avslutt spillet og vis sluttresultat'));
    else panel.append(el('button', { class:'bred', onclick: nesteRunde }, `Start runde ${m.runde+1}: forhandlinger`));
    if (m.runde >= 6 && m.runde < m.maksRunder) panel.append(el('button', { class:'bred sek', onclick: avsluttSpill }, 'Avslutt spillet nå (minimum seks runder er spilt)'));
  }

  panel.append(el('h2', {}, 'Poengstatus'));
  panel.append(poengTabell(m.poengTotal, null));
  if (m.fase !== 'avsloering') panel.append(justerPoeng());
}
function godkjenn(f) {
  const a = app.avtaler;
  if (f.type === 'vennskap') a.vennskapsavtaler.push({ land:f.land, tekst:f.tekst });
  if (f.type === 'sfaere') a.interessesfaerer.push({ land:f.land, byer:f.byer, signert:f.signert });
  if (f.type === 'koloni') a.kolonier.push({ land:f.land, byer:f.byer, trilateral:f.trilateral, signertAv:f.signertAv });
  if (f.type === 'tillatelse') {
    if (f.hva === 'suez' && !a.suezSamtykke.includes(f.land)) a.suezSamtykke.push(f.land);
    if (f.hva === 'base') a.baseInnpass.push({ by:f.by, land:f.land });
    if (f.hva === 'felles') a.fellesOkkupasjon.push({ by:f.by, land:[f.fra, f.land] });
    if (f.hva === 'sivil') a.sivilInnpass.push({ by:f.by, land:f.land });
  }
}
function justerPoeng() {
  const boks = el('details', { style:'margin-top:8px;font-size:13px' }, el('summary', {}, 'Juster poeng manuelt (minuspoeng, s. 5)'));
  SPILLDATA.land.forEach(l => boks.append(el('div', { class:'rad', style:'margin-top:4px' }, el('span', {}, l.navn), el('input', { type:'number', value:0, id:`just-${l.id}`, style:'max-width:80px' }),
    el('button', { class:'liten', onclick: async () => { const v = +$(`#just-${l.id}`).value||0; app.meta.poengTotal[l.id] += v; await lagre(K.meta(app.kode), app.meta); renderLaerer(); } }, 'Legg til'))));
  return boks;
}
async function settFase(fase) {
  const m = app.meta; m.fase = fase; m.faseStart = Date.now();
  await lagre(K.meta(app.kode), m); await oppfrisk(true);
}
async function settSteg(i) { await lagre(K.avsloering(app.kode), { runde:app.meta.runde, steg:i }); app.avsl = { runde:app.meta.runde, steg:i }; render(); }
async function nesteRunde() {
  const m = app.meta; m.runde += 1; m.fase = 'forhandling'; m.faseStart = Date.now();
  await lagre(K.meta(app.kode), m); await oppfrisk(true);
}
async function avsluttSpill() {
  const m = app.meta; m.fase = 'ferdig'; await lagre(K.meta(app.kode), m); await oppfrisk(true);
}

/* Avgjør runden: kjør regelmotoren på lærerens maskin og publiser resultatet */
async function avgjoerRunden() {
  if (app.avgjoer) return; app.avgjoer = true;
  const knapp = [...document.querySelectorAll('#panel button')].find(b => b.textContent.includes('avgjør runden'));
  if (knapp) { knapp.disabled = true; knapp.textContent = 'Avgjør runden …'; }
  try {
    await oppfrisk(true); // hent siste ordre og avtaler
    const m = JSON.parse(JSON.stringify(app.meta));
    const t = app.tilstand;
    if (!t || t.runde !== m.runde) return visAvgjoerFeil('Runden ser allerede ut til å være avgjort. Last siden på nytt.');
    const alle = {};
    Object.values(app.ordrer).filter(d => !d.rolle.endsWith('_dip')).forEach(d => d.ordrer.forEach(o => alle[o.enhetId] = o));
    if (REGJERINGSRUNDER.includes(m.runde)) Object.values(app.ordrer).filter(d => d.rolle.endsWith('_dip')).forEach(d => d.ordrer.forEach(o => alle[o.enhetId] = o));
    const ordrer = Object.values(alle);
    const foer = {}; t.enheter.forEach(e => foer[e.id] = e.sted);
    const res = MOTOR.avgjoerRunde(t, ordrer, app.avtaler || tomAvtaler());
    const etter = {}; res.tilstand.enheter.forEach(e => etter[e.id] = e.sted);
    const ordrerPerLand = {}; SPILLDATA.land.forEach(l => ordrerPerLand[l.id] = ordrer.filter(o => o.enhetId.startsWith(l.id + '_')));
    SPILLDATA.land.forEach(l => m.poengTotal[l.id] += res.poeng[l.id].sum);
    const resultat = JSON.parse(JSON.stringify({ runde:m.runde, ordrerPerLand, hendelser:res.hendelser, poeng:res.poeng, foer, etter, avtaler:app.avtaler || tomAvtaler(), poengTotal:{ ...m.poengTotal },
      kontrollFoer:{ militaerKontroll:t.militaerKontroll, oekonomiskKontroll:t.oekonomiskKontroll, interessesfaerer:t.interessesfaerer, kolonier:t.kolonier } }));
    // Resultatet lagres først; feiler det, er ingenting endret og læreren kan prøve igjen
    if (!await lagre(K.resultat(app.kode, m.runde), resultat)) return visAvgjoerFeil('Resultatet ble ikke lagret. Ingenting er endret – trykk «avgjør runden» igjen.');
    if (!await lagre(K.tilstand(app.kode), res.tilstand)) return visAvgjoerFeil('Kartet ble ikke oppdatert. Ingenting er endret – trykk «avgjør runden» igjen.');
    await lagre(K.avsloering(app.kode), { runde:m.runde, steg:0 });
    m.fase = 'avsloering'; m.faseStart = null;
    if (!await lagre(K.meta(app.kode), m)) return visAvgjoerFeil('Runden er avgjort, men faseskiftet ble ikke lagret. Trykk «avgjør runden» igjen hvis siden ikke går videre.');
    app.resultat = resultat; app.avsl = { runde:m.runde, steg:0 };
    await oppfrisk(true);
  } catch (e) {
    console.error(e); visAvgjoerFeil('Noe gikk galt under avgjørelsen: ' + (e && e.message || e));
  } finally { app.avgjoer = false; }
}
function visAvgjoerFeil(tekst) {
  render();
  const forklaring = sisteFeilTekst ? ` (Svar fra databasen: ${sisteFeilTekst})` : '';
  document.getElementById('panel').prepend(el('div', { class:'feilboks' }, tekst + forklaring));
}

/* ====================== OFFENTLIGGJØRING ====================== */
/* Steg: intro → ordrene land for land → hver hendelse (med enheter som flytter) → poeng */
function byggSteg(r) {
  if (!r) return [{ tekst:'Venter på resultatet …', posisjoner:null }];
  const steg = [];
  steg.push({ overskrift:`Runde ${r.runde}`, tekst:'Ordrene offentliggjøres. Full stillhet i lagene.', posisjoner:r.foer, piler:[] });
  SPILLDATA.land.forEach(l => {
    const o = r.ordrerPerLand[l.id] || [];
    const piler = o.filter(x => x.til).map(x => ({ fra:r.foer[x.enhetId], til:x.til, land:l.id, type:x.type }));
    steg.push({ overskrift:`${l.navn}s ordre`, tekst: o.length ? o.map(x => `${enhetNavnMedTilstand(x.enhetId, r)}: ${ordreTekst(x)}.`).join(' ') : 'Ingen ordre levert.', posisjoner:r.foer, piler, land:l.id });
  });
  // Avtaler
  const a = r.avtaler; const avt = [];
  if (a) { a.vennskapsavtaler?.forEach(x => avt.push(`Vennskapsavtale mellom ${x.land.map(id=>LAND[id].navn).join(' og ')}.`)); a.suezSamtykke?.forEach(x => avt.push(`Storbritannia gir ${LAND[x].navn} samtykke til å bruke Suezkanalen.`)); }
  if (avt.length) steg.push({ overskrift:'Avtaler', tekst:avt.join(' '), posisjoner:r.foer, piler:[] });
  // Hendelser – flytt enheter etter hvert
  const pos = { ...r.foer };
  r.hendelser.forEach(h => {
    const m1 = h.match(/^([a-z_0-9]+): ([a-z_]+) → ([a-z_]+)$/);
    if (m1) pos[m1[1]] = m1[3];
    const m2 = h.match(/^([a-z_0-9]+): .*returnerer til basen ([a-z_]+)/);
    if (m2) pos[m2[1]] = m2[2];
    const fremhev = new Set([...h.matchAll(/\b([a-z_]+)\b/g)].map(x => x[1]).filter(x => BY[x] || SJOPOS[x]));
    steg.push({ overskrift:'Avgjørelse', tekst:pentHendelseR(h, r), posisjoner:{ ...pos }, fremhev, piler:[] });
  });
  const oppsummering = SPILLDATA.land.map(l => `${l.navn}: ${r.poeng[l.id].sum} poeng denne runden (totalt ${r.poengTotal[l.id]})`).join(' · ');
  steg.push({ overskrift:`Poeng etter runde ${r.runde}`, tekst:oppsummering, posisjoner:r.etter, piler:[], poeng:true });
  return steg;
}
function enhetNavnMedTilstand(id, r) {
  const [land, type, ...rest] = id.split('_'); const base = rest.filter(x => !/^\d$/.test(x)).join('_');
  return type === 'mil' ? `${id.endsWith('_1')?'1.':'2.'} militære enhet fra ${stedNavn(base)} (står i ${stedNavn(r.foer[id])})` : `sivil stasjon fra ${stedNavn(base)} (står i ${stedNavn(r.foer[id])})`;
}
function pentHendelseR(h, r) {
  return h.replace(/\b([a-z]+_(?:mil|siv)_[a-z_0-9]+?)(?=:)/g, id => { const l = id.split('_')[0]; return `${LAND[l]?.navn || l}s ${enhetNavnMedTilstand(id, r).replace(/ \(står.*\)$/, '')}`; })
          .replace(/\b(hav_vest|hav_oest_med|hav_oest_india)\b/g, m0 => SJONAVN[m0])
          .replace(/\b([a-z_]+)\b/g, m0 => BY[m0] ? BY[m0].navn : m0);
}

function renderSkjerm() {
  const m = app.meta, svg = $('#kart-skjerm'), tekst = $('#skjerm-tekst');
  if (m.fase === 'avsloering' && app.resultat) {
    const steg = byggSteg(app.resultat), i = Math.min(app.avsl?.steg ?? 0, steg.length-1), s = steg[i];
    // Tilstanden på kartet: kontroll fra FØR runden inntil poengsteget, så etter
    const visTilstand = s.poeng ? app.tilstand : { ...app.tilstand, ...(app.resultat.kontrollFoer || {}) };
    tegnKart(svg, { tilstand:visTilstand, posisjoner:s.posisjoner, piler:s.piler, fremhev:s.fremhev });
    tekst.innerHTML = '';
    tekst.append(el('small', {}, `${s.overskrift || ''} · steg ${i+1} av ${steg.length}`), s.tekst);
    return;
  }
  tegnKart(svg, { tilstand:app.tilstand });
  tekst.innerHTML = '';
  if (m.fase === 'lobby') tekst.append(el('small', {}, 'Kampen om Afrika'), `Spillkode: ${m.kode}. Skriv koden inn og velg rolle.`);
  else if (m.fase === 'forhandling') tekst.append(el('small', {}, `Runde ${m.runde} · fase 1`), 'Forhandlinger. Alle kan snakke med alle — men bare avtaler mellom diplomater er bindende.');
  else if (m.fase === 'ordre') tekst.append(el('small', {}, `Runde ${m.runde} · fase 2`), 'Skriving av ordre. Uklare ordre regnes som ingen ordre.');
  else if (m.fase === 'ferdig') { const vinner = SPILLDATA.land.slice().sort((a,b)=>m.poengTotal[b.id]-m.poengTotal[a.id]); tekst.append(el('small', {}, 'Spillet er slutt'), vinner.map((l,i)=>`${i+1}. ${l.navn} ${m.poengTotal[l.id]} poeng`).join(' · ')); }
}
</script>
